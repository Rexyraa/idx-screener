[project]
name = "idx-screener"
version = "0.1.0"
description = "Local IDX stock screener with real Yahoo prices and a FastAPI dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "click>=8.1",
    "pydantic>=2.7",
    "scipy>=1.12",
    "yfinance>=0.2.63",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
screener = "idxscreener.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idxscreener = ["data/*.csv", "web/templates/*.html", "web/static/*.css", "web/static/*.js"]

